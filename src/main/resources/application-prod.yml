spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: false
  jpa:
    show-sql: false
app:
  jwt:
    secret: ${JWT_SECRET}
server:
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
