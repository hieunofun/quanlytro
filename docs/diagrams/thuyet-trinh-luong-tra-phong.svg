<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img">
<title>LUỒNG QUYẾT TOÁN TRẢ PHÒNG</title>
<desc>Tác nhân: ADMIN hoặc STAFF đúng khu • Công nợ bao gồm hóa đơn và điện nước kỳ cuối</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1920" height="1240" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="960" y="65" text-anchor="middle" font-size="38" font-weight="700">LUỒNG QUYẾT TOÁN TRẢ PHÒNG</text>
<text x="960" y="108" text-anchor="middle" font-size="23" fill="#475569">Tác nhân: ADMIN hoặc STAFF đúng khu • Công nợ bao gồm hóa đơn và điện nước kỳ cuối</text>
<rect x="640.0" y="144.0" width="640" height="76" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="960" y="182.0" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Chọn hợp đồng và ngày trả phòng</tspan>
</text>
<polygon points="960,255.0 1320.0,328 960,401.0 600.0,328" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="960" y="311.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Có quyền, hợp đồng/ngày hợp lệ,</tspan>
<tspan x="960" dy="33.48">chưa có bản quyết toán?</tspan>
</text>
<rect x="1400.0" y="281.0" width="400" height="94" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="1600" y="311.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="1600" dy="0">Dừng; thông báo</tspan>
<tspan x="1600" dy="33.48">lý do cụ thể</tspan>
</text>
<rect x="620.0" y="422.0" width="680" height="90" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="960" y="450.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Chốt chỉ số; hoàn tất hóa đơn</tspan>
<tspan x="960" dy="33.48">các kỳ đã ở và kỳ cuối</tspan>
</text>
<polygon points="960,540.0 1355.0,625 960,710.0 565.0,625" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="960" y="591.52" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Đủ hóa đơn phát hành,</tspan>
<tspan x="960" dy="33.48">ngày/chỉ số khớp,</tspan>
<tspan x="960" dy="33.48">không còn PENDING?</tspan>
</text>
<rect x="50.0" y="555.0" width="450" height="140" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="275" y="594.0" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="400">
<tspan x="275" dy="0">Dừng; bổ sung/kiểm tra dữ liệu</tspan>
<tspan x="275" dy="31.0">Không sửa trực tiếp</tspan>
<tspan x="275" dy="31.0">hóa đơn đã phát hành</tspan>
</text>
<rect x="565.0" y="746.0" width="790" height="92" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="960" y="775.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Tính số quyết toán =</tspan>
<tspan x="960" dy="33.48">cọc − thiệt hại − công nợ chưa thanh toán</tspan>
</text>
<polygon points="960,878.0 1305.0,949 960,1020.0 615.0,949" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="960" y="932.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Số quyết toán</tspan>
<tspan x="960" dy="33.48">≥ 0?</tspan>
</text>
<rect x="30.0" y="892.0" width="510" height="114" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="285" y="933.5" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="400">
<tspan x="285" dy="0">Số dương: hoàn tiền</tspan>
<tspan x="285" dy="31.0">Bằng 0: không hoàn / thu thêm</tspan>
</text>
<rect x="1380.0" y="892.0" width="510" height="114" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
<text x="1635" y="933.5" text-anchor="middle" dominant-baseline="middle" font-size="25" font-weight="400">
<tspan x="1635" dy="0">Số âm: ghi nhận phải thu thêm</tspan>
<tspan x="1635" dy="31.0">Giữ thông tin công nợ còn lại</tspan>
</text>
<rect x="390.0" y="1078.0" width="1140" height="100" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
<text x="960" y="1111.26" text-anchor="middle" dominant-baseline="middle" font-size="27" font-weight="400">
<tspan x="960" dy="0">Thực hiện thống nhất: lưu quyết toán, giao dịch cấn cọc;</tspan>
<tspan x="960" dy="33.48">cập nhật hợp đồng và trạng thái phòng</tspan>
</text>
<path d="M 960,220 L 960,255" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M 1320,328 L 1400,328" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="1360" y="303.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
<tspan x="1360" dy="0">Không</tspan>
</text>
<path d="M 960,401 L 960,422" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="993" y="411.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
<tspan x="993" dy="0">Có</tspan>
</text>
<path d="M 960,512 L 960,540" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M 565,625 L 500,625" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="530" y="600.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
<tspan x="530" dy="0">Không</tspan>
</text>
<path d="M 960,710 L 960,746" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="990" y="729.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
<tspan x="990" dy="0">Có</tspan>
</text>
<path d="M 960,838 L 960,878" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M 615,949 L 540,949" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="577" y="925.0" text-anchor="middle" dominant-baseline="middle" font-size="23" font-weight="700">
<tspan x="577" dy="0">Có</tspan>
</text>
<path d="M 1305,949 L 1380,949" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="1343" y="925.0" text-anchor="middle" dominant-baseline="middle" font-size="21" font-weight="700">
<tspan x="1343" dy="0">Không</tspan>
</text>
<path d="M 285,1006 L 285,1046 L 960,1046 L 960,1078" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<path d="M 1635,1006 L 1635,1046 L 960,1046" fill="none" stroke="#475569" stroke-width="2.7" marker-end="url(#arrow)"/>
<text x="960" y="1215" text-anchor="middle" font-size="22" fill="#475569">Không trừ điện nước hai lần. Giao dịch DEPOSIT_OFFSET là cấn cọc, không phải tiền mới nhận.</text>
</g></svg>